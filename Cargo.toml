[package]
name = "gimji"
version = "0.2.0"
edition = "2024"

[features]
default = []
s3 = ["dep:rust-s3", "dep:tokio"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde", "clock"] }
comrak = { version = "0.55.0", default-features = false }
directories = "6.0.0"
eframe = "0.34.3"
egui_extras = { version = "0.34.3", default-features = false, features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
resvg = { version = "0.45", default-features = false, features = ["text"] }
rust-s3 = { version = "0.37.2", default-features = false, features = ["fail-on-err", "tokio-rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread"], optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
